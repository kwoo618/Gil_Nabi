<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리뷰 관리</title>
    <style>
        /* 기존 스타일 그대로 유지 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #333;
            font-size: 32px;
        }
        
        .user-badge {
            background: #f5f7ff;
            padding: 10px 20px;
            border-radius: 10px;
            color: #667eea;
            font-weight: bold;
        }
        
        .logout-btn {
            background: #ff4444;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-left: 10px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .logout-btn:hover {
            background: #cc0000;
        }
        
        .section {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .rating-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .rating-btn {
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            min-width: 80px;
        }
        
        .rating-btn:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }
        
        .rating-btn.selected {
            border-color: #ffd700;
            background: #ffd700;
            color: white;
            font-weight: bold;
        }
        
        .disability-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .disability-btn {
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }
        
        .disability-btn:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }
        
        .disability-btn.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
            font-weight: bold;
        }
        
        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .review-list {
            display: grid;
            gap: 15px;
        }
        
        .review-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
        }
        
        .review-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
        
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .review-author {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .author-name {
            font-weight: bold;
            color: #333;
            font-size: 18px;
        }
        
        .author-badge {
            background: #f5f7ff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            color: #667eea;
        }
        
        .review-rating {
            color: #ffd700;
            font-size: 20px;
            font-weight: bold;
        }
        
        .review-content {
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .review-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #999;
            padding-top: 10px;
            border-top: 1px solid #e0e0e0;
        }
        
        .review-actions {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            padding: 5px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .action-btn:hover {
            background: #f5f7ff;
            border-color: #667eea;
        }
        
        .action-btn.delete {
            color: #ff4444;
            border-color: #ff4444;
        }
        
        .action-btn.delete:hover {
            background: #fff5f5;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        
        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .filter-btn:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }
        
        .filter-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error-message {
            background: #fff5f5;
            border: 2px solid #ff4444;
            border-radius: 10px;
            padding: 15px;
            color: #ff4444;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <div class="header">
            <h1>📝 리뷰 관리</h1>
            <div>
                <span class="user-badge" id="userBadge">로그인 필요</span>
                <button class="logout-btn" id="logoutBtn" style="display: none;" onclick="logout()">로그아웃</button>
            </div>
        </div>
        
        <!-- 리뷰 작성 섹션 -->
        <div class="section">
            <h2>새 리뷰 작성</h2>
            <div id="loginWarning" class="error-message" style="display: none;">
                ⚠️ 리뷰를 작성하려면 로그인이 필요합니다.
            </div>
            
            <form id="reviewForm">
                <div class="form-group">
                    <label>리뷰 내용 *</label>
                    <textarea 
                        id="reviewContent" 
                        placeholder="이 장소에 대한 리뷰를 작성해주세요. 장애인 편의시설이나 접근성에 대해 자세히 알려주시면 다른 분들에게 큰 도움이 됩니다." 
                        required
                    ></textarea>
                </div>
                
                <div class="form-group">
                    <label>별점 *</label>
                    <div class="rating-group">
                        <button type="button" class="rating-btn" data-rating="1">⭐ 1점</button>
                        <button type="button" class="rating-btn" data-rating="2">⭐⭐ 2점</button>
                        <button type="button" class="rating-btn" data-rating="3">⭐⭐⭐ 3점</button>
                        <button type="button" class="rating-btn" data-rating="4">⭐⭐⭐⭐ 4점</button>
                        <button type="button" class="rating-btn" data-rating="5">⭐⭐⭐⭐⭐ 5점</button>
                    </div>
                    <input type="hidden" id="rating" required>
                </div>
                
                <div class="form-group">
                    <label>장애 유형 (자동 입력됨)</label>
                    <div class="disability-group">
                        <button type="button" class="disability-btn" data-type="visual">시각 장애 👁️</button>
                        <button type="button" class="disability-btn" data-type="hearing">청각 장애 👂</button>
                        <button type="button" class="disability-btn" data-type="physical">지체 장애 🦾</button>
                    </div>
                    <input type="hidden" id="disabilityType">
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn" disabled>리뷰 등록</button>
            </form>
        </div>
        
        <!-- 리뷰 목록 섹션 -->
        <div class="section">
            <h2>리뷰 목록</h2>
            
            <!-- 필터 -->
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">전체</button>
                <button class="filter-btn" data-filter="visual">시각 장애</button>
                <button class="filter-btn" data-filter="hearing">청각 장애</button>
                <button class="filter-btn" data-filter="physical">지체 장애</button>
                <button class="filter-btn" data-filter="5">⭐ 5점</button>
                <button class="filter-btn" data-filter="4">⭐ 4점</button>
            </div>
            
            <div id="reviewList" class="review-list">
                <div class="loading">리뷰를 불러오는 중...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        let currentUser = null;
        let currentFilter = 'all';
        
        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            checkLogin();
            loadReviews();
            setupEventListeners();
        });
        
        // ✅ 로그인 체크 (JWT 토큰 사용)
        async function checkLogin() {
            // URL에서 토큰 가져오기
            const urlParams = new URLSearchParams(window.location.search);
            const accessToken = urlParams.get('access_token');
            const refreshToken = urlParams.get('refresh_token');
            
            // 토큰이 URL에 있으면 저장
            if (accessToken && refreshToken) {
                localStorage.setItem('access_token', accessToken);
                localStorage.setItem('refresh_token', refreshToken);
                
                // URL 파라미터 제거
                window.history.replaceState({}, document.title, '/reviews.html');
            }
            
            // 저장된 토큰으로 사용자 정보 가져오기
            const token = localStorage.getItem('access_token');
            
            if (!token) {
                showLoginRequired();
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/users/profile/`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const userData = await response.json();
                    currentUser = userData;
                    
                    document.getElementById('userBadge').textContent = `👤 ${userData.username}`;
                    document.getElementById('logoutBtn').style.display = 'inline-block';
                    document.getElementById('loginWarning').style.display = 'none';
                    
                    // 장애 유형 자동 선택
                    const disabilityBtn = document.querySelector(`[data-type="${userData.disability_type}"]`);
                    if (disabilityBtn) {
                        disabilityBtn.classList.add('selected');
                        document.getElementById('disabilityType').value = userData.disability_type;
                    }
                } else if (response.status === 401) {
                    // 토큰 만료 시 갱신 시도
                    await refreshAccessToken();
                    await checkLogin(); // 재시도
                } else {
                    showLoginRequired();
                }
            } catch (error) {
                console.error('로그인 확인 실패:', error);
                showLoginRequired();
            }
        }
        
        // 로그인 필요 표시
        function showLoginRequired() {
            document.getElementById('loginWarning').style.display = 'block';
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('userBadge').textContent = '로그인 필요';
            document.getElementById('logoutBtn').style.display = 'none';
        }
        
        // ✅ Access Token 갱신
        async function refreshAccessToken() {
            const refreshToken = localStorage.getItem('refresh_token');
            
            if (!refreshToken) {
                showLoginRequired();
                return false;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/users/auth/token/refresh/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        refresh_token: refreshToken
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.access);
                    console.log('✅ 토큰 갱신 성공');
                    return true;
                } else {
                    showLoginRequired();
                    localStorage.clear();
                    return false;
                }
            } catch (error) {
                console.error('토큰 갱신 실패:', error);
                showLoginRequired();
                localStorage.clear();
                return false;
            }
        }
        
        // ✅ 로그아웃
        async function logout() {
            if (!confirm('로그아웃 하시겠습니까?')) {
                return;
            }
            
            const token = localStorage.getItem('access_token');
            
            try {
                await fetch(`${API_BASE_URL}/users/auth/logout/`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
            } catch (error) {
                console.error('로그아웃 요청 실패:', error);
            }
            
            localStorage.clear();
            window.location.href = '/';
        }
        
        // 이벤트 리스너 설정
        function setupEventListeners() {
            // 별점 선택
            const ratingButtons = document.querySelectorAll('.rating-btn');
            ratingButtons.forEach(button => {
                button.addEventListener('click', function() {
                    ratingButtons.forEach(btn => btn.classList.remove('selected'));
                    this.classList.add('selected');
                    document.getElementById('rating').value = this.dataset.rating;
                    checkFormValid();
                });
            });
            
            // 장애 유형 선택
            const disabilityButtons = document.querySelectorAll('.disability-btn');
            disabilityButtons.forEach(button => {
                button.addEventListener('click', function() {
                    disabilityButtons.forEach(btn => btn.classList.remove('selected'));
                    this.classList.add('selected');
                    document.getElementById('disabilityType').value = this.dataset.type;
                    checkFormValid();
                });
            });
            
            // 리뷰 내용 입력
            document.getElementById('reviewContent').addEventListener('input', checkFormValid);
            
            // 폼 제출
            document.getElementById('reviewForm').addEventListener('submit', handleSubmit);
            
            // 필터 버튼
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(button => {
                button.addEventListener('click', function() {
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    loadReviews();
                });
            });
        }
        
        // 폼 유효성 검사
        function checkFormValid() {
            const content = document.getElementById('reviewContent').value.trim();
            const rating = document.getElementById('rating').value;
            const disabilityType = document.getElementById('disabilityType').value;
            
            const submitBtn = document.getElementById('submitBtn');
            if (currentUser && content && rating && disabilityType) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }
        
        // ✅ 리뷰 제출 (JWT 토큰 사용)
        async function handleSubmit(e) {
            e.preventDefault();
            
            if (!currentUser) {
                alert('로그인이 필요합니다!');
                return;
            }
            
            const token = localStorage.getItem('access_token');
            
            const formData = {
                content: document.getElementById('reviewContent').value.trim(),
                rating: parseInt(document.getElementById('rating').value),
                disability_type: document.getElementById('disabilityType').value
            };
            
            console.log('제출할 리뷰 데이터:', formData);
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/reviews/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`  // ✅ JWT 토큰 포함
                    },
                    body: JSON.stringify(formData)
                });
                
                if (response.status === 401) {
                    // 토큰 만료 시 갱신 후 재시도
                    const refreshed = await refreshAccessToken();
                    if (refreshed) {
                        return handleSubmit(e);
                    }
                    return;
                }
                
                if (response.ok) {
                    const result = await response.json();
                    alert('리뷰가 등록되었습니다! 🎉');
                    
                    // 폼 초기화
                    document.getElementById('reviewForm').reset();
                    document.querySelectorAll('.rating-btn').forEach(btn => btn.classList.remove('selected'));
                    document.getElementById('rating').value = '';
                    
                    // 장애 유형은 유지
                    const disabilityBtn = document.querySelector(`[data-type="${currentUser.disability_type}"]`);
                    if (disabilityBtn) {
                        disabilityBtn.classList.add('selected');
                        document.getElementById('disabilityType').value = currentUser.disability_type;
                    }
                    
                    checkFormValid();
                    loadReviews();
                } else {
                    const result = await response.json();
                    alert('오류가 발생했습니다: ' + (result.detail || JSON.stringify(result)));
                }
            } catch (error) {
                console.error('에러:', error);
                alert('서버와 통신 중 오류가 발생했습니다.');
            }
        }
        
        // ✅ 리뷰 목록 불러오기 (인증 불필요)
        async function loadReviews() {
            const reviewList = document.getElementById('reviewList');
            reviewList.innerHTML = '<div class="loading">리뷰를 불러오는 중...</div>';
            
            try {
                let url = `${API_BASE_URL}/api/reviews/`;
                const params = new URLSearchParams();
                
                if (currentFilter !== 'all') {
                    if (['visual', 'hearing', 'physical'].includes(currentFilter)) {
                        params.append('disability_type', currentFilter);
                    }
                    else if (['1', '2', '3', '4', '5'].includes(currentFilter)) {
                        params.append('rating', currentFilter);
                    }
                }
                
                if (params.toString()) {
                    url += '?' + params.toString();
                }
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error('리뷰를 불러올 수 없습니다.');
                }
                
                const reviews = await response.json();
                displayReviews(reviews);
                
            } catch (error) {
                console.error('에러:', error);
                reviewList.innerHTML = `
                    <div class="error-message">
                        ⚠️ 리뷰를 불러오는 중 오류가 발생했습니다: ${error.message}
                    </div>
                `;
            }
        }
        
        // 리뷰 목록 표시
        function displayReviews(reviews) {
            const reviewList = document.getElementById('reviewList');
            
            if (reviews.length === 0) {
                reviewList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <p>아직 작성된 리뷰가 없습니다.</p>
                        <p>첫 번째 리뷰를 작성해보세요!</p>
                    </div>
                `;
                return;
            }
            
            reviewList.innerHTML = reviews.map(review => createReviewCard(review)).join('');
            
            // 삭제 버튼 이벤트 리스너 추가
            document.querySelectorAll('.action-btn.delete').forEach(btn => {
                btn.addEventListener('click', function() {
                    const reviewId = this.dataset.id;
                    deleteReview(reviewId);
                });
            });
        }
        
        // 리뷰 카드 HTML 생성
        function createReviewCard(review) {
            const disabilityTypeMap = {
                'visual': '시각 장애 👁️',
                'hearing': '청각 장애 👂',
                'physical': '지체 장애 🦾'
            };
            
            const stars = '⭐'.repeat(review.rating);
            const date = new Date(review.created_at).toLocaleDateString('ko-KR');
            
            // ✅ user ID로 비교
            // const isMyReview = currentUser && review.user === currentUser.id;
            const isMyReview = true;
            console.log('isMyReview:', isMyReview);
            return `
                <div class="review-card">
                    <div class="review-header">
                        <div class="review-author">
                            <span class="author-name">${review.username || '익명'}</span>
                            <span class="author-badge">${disabilityTypeMap[review.disability_type] || review.disability_type}</span>
                        </div>
                        <div class="review-rating">${stars} ${review.rating}점</div>
                    </div>
                    <div class="review-content">${review.content}</div>
                    <div class="review-footer">
                        <span>${date}</span>
                        ${isMyReview ? `
                            <div class="review-actions">
                                <button class="action-btn delete" data-id="${review.id}">삭제</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }
        
        // ✅ 리뷰 삭제 (JWT 토큰 사용)
        async function deleteReview(reviewId) {
            if (!confirm('정말 이 리뷰를 삭제하시겠습니까?')) {
                return;
            }
            
            const token = localStorage.getItem('access_token');
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/reviews/${reviewId}/`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`  // ✅ JWT 토큰 포함
                    }
                });
                
                if (response.status === 401) {
                    // 토큰 만료 시 갱신 후 재시도
                    const refreshed = await refreshAccessToken();
                    if (refreshed) {
                        return deleteReview(reviewId);
                    }
                    return;
                }
                
                if (response.ok || response.status === 204) {
                    alert('리뷰가 삭제되었습니다.');
                    loadReviews();
                } else {
                    const result = await response.json();
                    alert('삭제 실패: ' + (result.detail || '알 수 없는 오류'));
                }
            } catch (error) {
                console.error('에러:', error);
                alert('서버와 통신 중 오류가 발생했습니다.');
            }
        }
    </script>
</body>
