<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소셜 로그인 테스트</title>
    <style>
        /* CSS 생략 */
    </style>
</head>
<body>
    <div class="container">
        <h1>길나비 🦋</h1>
        <p>소셜 로그인으로 시작하기</p>
        
        <button class="login-btn kakao-btn" onclick="kakaoLogin()">
            카카오 로그인
        </button>
        
        <button class="login-btn google-btn" onclick="googleLogin()">
            구글 로그인
        </button>
    </div>

    <script>
        // ✅ 설정값
        const KAKAO_CLIENT_ID = 'bd7ae62c24fac01bfab454069702580f';
        const GOOGLE_CLIENT_ID = '847051237257-fnieo1f299k2bob0av16pj5d7pbcfrth.apps.googleusercontent.com';
        const REDIRECT_URI = 'http://localhost:8000/users/auth/login/';
        
        // 카카오 로그인
        function kakaoLogin() {
            const kakaoAuthUrl = 
                `https://kauth.kakao.com/oauth/authorize?` +
                `client_id=${KAKAO_CLIENT_ID}` +
                `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
                `&response_type=code` +
                `&state=kakao`;
            
            console.log('🟡 카카오 로그인 URL:', kakaoAuthUrl);
            window.location.href = kakaoAuthUrl;
        }
        
        // 구글 로그인
        function googleLogin() {
            const googleAuthUrl = 
                `https://accounts.google.com/o/oauth2/v2/auth?` +
                `client_id=${GOOGLE_CLIENT_ID}` +
                `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
                `&response_type=code` +
                `&scope=openid%20email%20profile` +
                `&state=google`;
            
            console.log('🔵 구글 로그인 URL:', googleAuthUrl);
            window.location.href = googleAuthUrl;
        }
        
        // ✅ 초기화 확인
        console.log('✅ 설정 로드 완료');
        console.log('카카오 Client ID:', KAKAO_CLIENT_ID);
        console.log('구글 Client ID:', GOOGLE_CLIENT_ID);
    </script>
</body>
</html>
