<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>길나비 - 데이터베이스 연동 지도</title>
    <style>
        /* 지도를 화면에 꽉 채우기 위한 스타일 */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=508b2ac52c84b32d74cb1b0f82492118"></script>

    {{ places|json_script:"places-data" }}
    <script>
        // 3. 위에서 변환된 JSON 데이터를 가져와 JavaScript 객체 배열로 변환
        const places = JSON.parse(document.getElementById('places-data').textContent);

        // 지도 생성 기본 설정
        const container = document.getElementById('map');
        const options = {
            center: new kakao.maps.LatLng(35.900, 128.852), // 지도 중심좌표 (데이터 위치 근처)
            level: 3 // 여러 마커를 보여주기 위해 지도 축소
        };
        const map = new kakao.maps.Map(container, options);

        // 4. places 배열의 각 데이터를 순회하며 마커를 생성하고 지도에 표시
        places.forEach(function(place) {
            
            // 마커를 생성합니다
            const marker = new kakao.maps.Marker({
                // 마커를 표시할 위치 (DB의 위도, 경도 필드 사용)
                position: new kakao.maps.LatLng(place.latitude, place.longitude),
                // 마커에 마우스를 올리면 표시될 타이틀 (DB의 건물명 필드 사용)
                title: place.building_name 
            });

            // 지도에 마커를 표시합니다
            marker.setMap(map);
        });
    </script>
</body>
</html>
