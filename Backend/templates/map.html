{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>길나비 - 무장애 지도</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Noto Sans KR', sans-serif; }
        #container { display: flex; height: 100vh; }
        
        /* 사이드바 스타일 */
        #sidebar { width: 350px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; z-index: 2; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        .search-box { padding: 15px; background: #f8f9fa; border-bottom: 1px solid #eee; }
        .search-box input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .search-box button { padding: 8px; border-radius: 4px; cursor: pointer; }
        #search-btn { width: 60px; background: #007bff; color: white; border: none; }
        #voice-btn { width: 40px; background: #fff; border: 1px solid #ddd; color: #333; }
        
        /* 필터 영역 */
        .filter-box { padding: 10px 15px; border-bottom: 1px solid #eee; display: flex; flex-wrap: wrap; gap: 10px; background: #fff; }
        .filter-item { font-size: 13px; display: flex; align-items: center; cursor: pointer; }
        .filter-item input { margin-right: 5px; }

        /* 결과 목록 */
        #results { flex: 1; overflow-y: auto; padding: 10px; }
        .result-item:hover { background-color: #f0f8ff; }

        /* 지도 영역 */
        #map { flex: 1; height: 100%; position: relative; }

        /* AI 버튼 */
        .ai-btn {
            width: 100%; margin-top: 10px; padding: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 4px;
            font-weight: bold; cursor: pointer;
        }

        /* 내 위치 버튼 */
        .my-location-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            width: 40px;
            height: 40px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .my-location-btn:hover { background-color: #f8f9fa; }
    </style>
</head>
<body>

<div id="container">
    <!-- 사이드바 -->
    <div id="sidebar">
        <div class="search-box">
            <div style="display:flex; gap: 5px;">
                <input type="text" id="search-input" placeholder="장소 검색 (예: 카페, 공학 7관)">
                <button id="voice-btn" onclick="voiceHandler.startVoiceRecognition()" title="음성 검색">🎤</button>
                <button id="search-btn" onclick="mapSearch.search()">검색</button>
            </div>
            <button class="ai-btn" onclick="mapAI.getRecommendation()">🤖 AI 추천 받기</button>
        </div>

        <div class="filter-box">
            <label class="filter-item"><input type="checkbox" id="wheelchair"> ♿ 휠체어</label>
            <label class="filter-item"><input type="checkbox" id="elevator"> 🛗 엘리베이터</label>
            <label class="filter-item"><input type="checkbox" id="ramp"> 📐 경사로</label>
            <label class="filter-item"><input type="checkbox" id="toilet"> 🚻 화장실</label>
        </div>

        <div id="results">
            <p style="text-align:center; color:#888; margin-top:20px;">
                검색하거나 지도를 클릭해보세요.<br>
                <small>필터를 체크하면 조건에 맞는 장소만 보입니다.</small>
            </p>
        </div>
        
        <!-- 디버그용 버튼 (개발 중에만 사용) -->
        <div style="padding:10px; border-top:1px solid #eee; text-align:center;">
            <button onclick="mapUI.showDBInfo()" style="background:#eee; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">📊 DB 현황 보기</button>
            <button onclick="debugHelper.checkAllSystems()" style="background:#e2e6ea; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">🛠️ 시스템 점검</button>
            <button onclick="debugHelper.generateTestData()" style="background:#d4edda; color:#155724; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; margin-top:5px;">🎲 테스트 데이터 생성</button>
            <button onclick="voiceHandler.processVoiceCommand('내 주변 휠체어 접근 가능한 카페')" style="background:#fff3cd; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; margin-top:5px;">🗣️ 음성 명령 테스트</button>
            <button onclick="mapMain.resetAll()" style="background:#eee; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">🔄 초기화</button>
        </div>
    </div>

    <!-- 지도 -->
    <div id="map">
        <button class="my-location-btn" onclick="mapMain.moveToCurrentLocation()" title="내 위치로">🎯</button>
    </div>
</div>

<!-- 1. 카카오맵 SDK 로드 (API 키 적용) -->
<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey={{ kakao_map_key }}&libraries=services,clusterer,drawing"></script>

<!-- 2. 모듈화된 JS 파일 로드 (순서 중요!) -->
<!-- UI 및 헬퍼 -->
<script src="{% static 'js/map_ui.js' %}"></script>
<script src="{% static 'js/map_markers.js' %}"></script>

<!-- 기능 모듈 -->
<script src="{% static 'js/map_info.js' %}"></script>
<script src="{% static 'js/map_filter.js' %}"></script>
<script src="{% static 'js/map_search.js' %}"></script>
<script src="{% static 'js/map_click.js' %}"></script>
<script src="{% static 'js/map_ai.js' %}"></script>
<script src="{% static 'js/voice_handler.js' %}"></script>
<script src="{% static 'js/debug_helper.js' %}"></script>

<!-- 메인 컨트롤러 (가장 마지막에 로드) -->
<script src="{% static 'js/map_main.js' %}"></script>

<script>
    // 엔터키 검색 지원
    document.getElementById('search-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') mapSearch.search();
    });
</script>

</body>
</html>
